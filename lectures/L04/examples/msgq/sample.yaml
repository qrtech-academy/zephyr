sample:
  name: Message queue
  description: A fast producer and a slow consumer, connected by a k_msgq.
common:
  platform_allow: native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  extra_configs:
    - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
tests:
  qacademy.l04.msgq:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "--- K_NO_WAIT: drop when full"
        - "queue full, dropped #8 \\(1 dropped\\)"
        - "queue full, dropped #12 \\(3 dropped\\)"
        - "--- K_FOREVER: block when full"
        - "produced #21, blocked 150 ms, queue 4/4"
        - "consumed #24, 1154 ms old"
