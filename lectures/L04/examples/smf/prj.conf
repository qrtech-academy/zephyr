# The State Machine Framework, with parent states: a state that does not handle an event can pass
# it on to its parent.
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

# Event objects, which carry the events to the state machine's thread.
CONFIG_EVENTS=y

# One tick per millisecond, so the timestamps in the trace are the delays in the code.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
