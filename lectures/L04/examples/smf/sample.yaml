sample:
  name: State Machine Framework
  description: A hierarchical heater state machine driven by k_event events.
common:
  platform_allow: native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  extra_configs:
    - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
tests:
  qacademy.l04.smf:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "OPERATIONAL entry"
        - "IDLE        entry: heater off"
        - "event START"
        - "HEATING     entry: heater on"
        - "event FAULT"
        - "OPERATIONAL exit"
        - "FAULT       entry: heater off until reset"
        - "FAULT       ignores the event"
        - "event RESET"
        - "OPERATIONAL entry"
        - "event STOP"
        - "OPERATIONAL ignores the event"
