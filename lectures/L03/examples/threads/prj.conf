# Give every thread a name, so that k_thread_name_get() can print who is running.
CONFIG_THREAD_NAME=y

# Run main() at a low preemptible priority (0 is the highest preemptible one, 14 the lowest). Every
# thread main() wakes then has a higher priority, and runs the moment main() wakes it.
CONFIG_MAIN_THREAD_PRIORITY=10
