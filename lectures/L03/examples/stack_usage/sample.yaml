sample:
  name: Stack usage
  description: Static per-function stack analysis with -fstack-usage, where runtime checks are unavailable.
common:
  platform_allow: native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  extra_configs:
    - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
tests:
  qacademy.l03.stack_usage:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "round 1: report of 2048 bytes, on a stack of 1024 bytes"
        - "round 3: report of 2048 bytes, on a stack of 1024 bytes"
