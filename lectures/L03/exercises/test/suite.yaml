# L03 test suite: one entry per exercise set. What each key means is in ci/suite.py, which does
# the building and running; see README.md for what is tested. Exercise Set 5 has no code.

# Exercise Set 1: three periodic threads and main, and who runs when.
exercise1:
  needs: [exercise1/CMakeLists.txt, exercise1/prj.conf, exercise1/src/main.c]
  programs:
    - stop_at: 2
      expected: exercise1.txt

# Exercise Set 2: a periodic timer that hands its samples to the system work queue.
exercise2:
  needs: [exercise2/CMakeLists.txt, exercise2/prj.conf, exercise2/src/main.c]
  programs:
    - stop_at: 2
      expected: exercise2.txt

# Exercise Set 3: a bouncing button, debounced with delayable work.
exercise3:
  needs: [exercise3/CMakeLists.txt, exercise3/prj.conf, exercise3/app.overlay,
          exercise3/src/main.c]
  programs:
    - stop_at: 2
      expected: exercise3.txt

# Exercise Set 4: three conversions, waited for without spinning.
exercise4:
  needs: [exercise4/CMakeLists.txt, exercise4/prj.conf, exercise4/src/main.c]
  programs:
    - stop_at: 1
      expected: exercise4.txt
