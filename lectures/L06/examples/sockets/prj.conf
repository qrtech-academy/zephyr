# Networking with BSD-style sockets over IPv4.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y

# Offload the sockets to native_sim's host: every zsock_ call becomes a call to the Linux socket
# API, so the program talks to the host's network directly. Zephyr's own IP stack is not used, and
# no TAP interface, bridge or root privileges are needed. The price is that nothing below the
# socket API is Zephyr's: this tests the application, not the network stack.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n

CONFIG_LOG=y
