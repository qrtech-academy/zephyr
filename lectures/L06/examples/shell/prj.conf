# The shell, with the kernel's own commands (kernel uptime, kernel thread list, ...), which it
# brings in by default, and the log command, which it does not.
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_CMDS=y

# The emulated LED behind the led command.
CONFIG_GPIO=y

# native_sim puts the shell's UART on a pseudo-terminal of its own by default, which you would have
# to connect to from a second terminal. This puts it on the terminal you start the program from
# instead, so you can type commands straight into it, or pipe them in.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
