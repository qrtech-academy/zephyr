# The settings subsystem stores key-value pairs through a storage back-end. With ZMS (Zephyr
# Memory Storage) enabled, it picks ZMS, which writes to the flash partition labelled
# storage_partition in the board's devicetree. On native_sim that flash is simulated, in a file.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

CONFIG_LOG=y

# ZMS logs its mount at level INF; only warnings and errors are of interest here.
CONFIG_ZMS_LOG_LEVEL_WRN=y
